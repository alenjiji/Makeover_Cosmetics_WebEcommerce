# nginx site for a Hostinger VPS: proxies to the Next.js server started by PM2 on :3000.
# Install to /etc/nginx/sites-available/, symlink into sites-enabled, then add HTTPS with
#   sudo certbot --nginx -d makeoveroverseas.com -d www.makeoveroverseas.com
# (certbot adds the 443 server and the http -> https redirect).

# www -> apex
server {
    listen 80;
    server_name www.makeoveroverseas.com;
    return 301 $scheme://makeoveroverseas.com$request_uri;
}

server {
    listen 80;
    server_name makeoveroverseas.com;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The contact form rate-limits by the first address in X-Forwarded-For.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming / partial prerendering (also signalled by X-Accel-Buffering from the app).
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
