# Netlify detects Next.js and applies its OpenNext adapter automatically, which supports
# the contact form's Server Action, image optimisation and partial prerendering.
# Set the environment variables from .env.example under Site configuration.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Files in public/ aren't content-hashed: cache for a week, refresh in the background.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
